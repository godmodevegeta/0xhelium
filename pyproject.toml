[project]
name = "robustlab"
version = "0.1.0"
description = "Robustness Studio M0: run a pretrained Go1 walking policy in native MuJoCo on CPU"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "mujoco==3.15.0",
]

[project.scripts]
robustlab = "robustlab.cli:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "hypothesis>=6.100",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robustlab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Steering/spec Markdown is human-authored; never let `ruff format` rewrite its code blocks.
extend-exclude = [".kiro", "tests/reference/weeble_sim.py"]  # oracle stays byte-identical upstream

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
filterwarnings = [
    # starlette 1.x TestClient deprecation of httpx; affects tests only
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "integration: slower native MuJoCo rollouts; deselected by default, run with -m integration",
]
