[project]
name = "robustlab"
version = "0.1.0"
description = "Robustness Studio M0: run a pretrained Go1 walking policy in native MuJoCo on CPU"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "mujoco==3.15.0",
]

[project.scripts]
robustlab = "robustlab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robustlab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Steering/spec Markdown is human-authored; never let `ruff format` rewrite its code blocks.
extend-exclude = [".kiro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: slower native MuJoCo rollouts; deselected by default, run with -m integration",
]
